<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

			initial-scale=1" />
    <title>Don Mariano Marcos Memorial State University</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="header">
        <img src="dmmmsulogo.png" alt="DMMMSU Logo" class="logo">
        <span class="name">DMMMSU</span>
    </header>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="home.html"> Home </a></li>
            <li><a href="aboutus.html"> About Us </a></li>
            <li><a href="contactus.html"> Contact Us </a></li>
        </ul>
    </nav>

    <div class="content">
        <main class="login-box">
            <h3> LogIn Form </h3>
            <form action="#" method="post" class="login-form">
                <div class="input">
                    <label> Username: </label>
                    <input type="text" name="Username" required> </input>
                    <label> Password: </label>
                    <input type="password" name="Password" required> </input>
                </div>

                <div class="buttons">
                    <button type="submit" class="btn"> Log In </button>
                    <button type="submit" class="btn"> Register </button>
                </div>

            </form>
        </main>
        <aside class="image-box">
            <img src="image1.jfif" alt="image1">
        </aside>
    </div>

    <div class="footer">
        <h4>Alright Reserved 2027</h4>
    </div>
